[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=. --cov-report=term-missing --cov-report=html
log_cli = true
log_cli_level = INFO
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::FutureWarning
    ignore:.*Python 3.8 is no longer supported.*
